<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Проверка</title></head>
<body>
  <pre id="result">WAIT</pre>
  <iframe id="app" src="index.html" width="375" height="812"></iframe>
  <script>
    const result = document.querySelector("#result");
    const frame = document.querySelector("#app");
    let phase = 0;

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    frame.addEventListener("load", () => {
      try {
        const doc = frame.contentDocument;

        if (phase === 0) {
          const controls = [...doc.querySelectorAll("input, select, button")];
          assert(doc.documentElement.scrollWidth <= 375, "Есть горизонтальная прокрутка");
          assert(controls.every((control) => control.getBoundingClientRect().height >= 44), "Элемент меньше 44 px");

          const form = doc.querySelector("#expense-form");
          const amount = doc.querySelector("#amount");
          const date = doc.querySelector("#date");
          const comment = doc.querySelector("#comment");
          const currentDate = date.value;

          function add(value, expenseDate, expenseComment = "") {
            amount.value = value;
            date.value = expenseDate;
            comment.value = expenseComment;
            form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
          }

          add("5 000", currentDate, "Продукты");
          add("2500", currentDate);
          add("12000", currentDate);
          assert(doc.querySelector("#month-total").textContent === "19 500 ₸", "Неверный итог");
          assert(doc.querySelector(".expense-item__amount").textContent === "12 000 ₸", "Новая трата не сверху");

          const now = new Date();
          const other = new Date(now.getFullYear(), now.getMonth() - 1, 15);
          const otherDate = `${other.getFullYear()}-${String(other.getMonth() + 1).padStart(2, "0")}-15`;
          add("700", otherDate);
          assert(doc.querySelector("#month-total").textContent === "19 500 ₸", "Чужой месяц вошёл в итог");

          add("0", currentDate);
          assert(doc.querySelectorAll(".expense-item").length === 4, "Неверная сумма сохранилась");
          assert(doc.querySelector("#amount-error").textContent.length > 0, "Нет подсказки об ошибке");
          assert(!doc.body.textContent.includes("NaN"), "Показан NaN");

          phase = 1;
          frame.contentWindow.location.reload();
          return;
        }

        assert(doc.querySelectorAll(".expense-item").length === 4, "Данные пропали после F5");
        assert(doc.querySelector("#month-total").textContent === "19 500 ₸", "Итог пропал после F5");
        result.textContent = "PASS";
      } catch (error) {
        result.textContent = `FAIL: ${error.message}`;
      }
    });
  </script>
</body>
</html>
