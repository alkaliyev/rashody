<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f2eb">
    <title>Мои расходы</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <header class="page__header">
        <p class="eyebrow">Личный бюджет</p>
        <h1>Мои расходы</h1>
      </header>

      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Новая трата</h2>

        <form id="expense-form" novalidate>
          <div class="field">
            <label for="amount">Сумма, ₸</label>
            <input
              id="amount"
              name="amount"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="Например, 5 000"
              aria-describedby="amount-error"
              required
            >
            <p class="field__error" id="amount-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="category">Категория</label>
            <select id="category" name="category">
              <option value="Еда">Еда</option>
              <option value="Транспорт">Транспорт</option>
              <option value="Дом">Дом</option>
              <option value="Другое">Другое</option>
            </select>
          </div>

          <div class="field">
            <label for="date">Дата</label>
            <input id="date" name="date" type="date" required>
          </div>

          <div class="field">
            <label for="comment">Комментарий <span>(необязательно)</span></label>
            <input
              id="comment"
              name="comment"
              type="text"
              maxlength="120"
              autocomplete="off"
              placeholder="Например, продукты"
            >
          </div>

          <button type="submit">Добавить</button>
        </form>
      </section>

      <section class="expenses" aria-labelledby="expenses-title">
        <div class="summary">
          <div>
            <p class="summary__label">За текущий месяц</p>
            <h2 id="expenses-title">Траты</h2>
          </div>
          <output class="summary__total" id="month-total">0 ₸</output>
        </div>

        <p class="empty-state" id="empty-state">Пока трат нет</p>
        <ul class="expense-list" id="expense-list" aria-live="polite"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
